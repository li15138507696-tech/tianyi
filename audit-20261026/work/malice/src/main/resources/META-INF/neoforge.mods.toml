modId = "guzhenren_malice"
version = "1.1.1"
displayName = "蛊真人 · 恶意适配（__VARIANT_LABEL__）"
description = '''
把蛊真人本体里的妖兽接进「恶意」（l2hostility）的难度体系：
三档妖兽配置（普通 / 精英 / 妖王）+ 排除档（剧情 NPC、商人、术法特效实体不接管）、
专属词条白名单、四档可切换难度（安逸 ×0.6 / 标准 ×1.0 / 凶险 ×1.5 / 噩梦 ×2.2）。

本包专用于 __VARIANT_DESC__。
三个本体版本（9.8 / 10.4 / 10.20）必须装对应的包，混装会导致 modId 冲突。

本体基础属性一行都没动 —— 强度全部来自恶意自己的等级机制，
所以卸载本 mod 后存档立刻回到「只有恶意」的原状。

命令：/guzhenren_malice difficulty <档位>、/guzhenren_malice probe <实体>。
'''
authors = "guzhenren_malice"

